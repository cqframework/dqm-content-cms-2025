[pytest]
# Collect only from the test package. Without this, pytest scans the whole tree
# and picks up production functions whose names start with `test_` -- notably
# compare_results.test_case_outcomes(expected_rows, actual_rows), a domain
# function ("outcomes per test case"), which pytest tried to run as a test and
# errored on with "fixture 'expected_rows' not found".
testpaths = scripts/tests
